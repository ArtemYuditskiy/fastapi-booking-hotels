[project]
name = "fastapi-hotel-booking"
version = "0.1.0"
description = "An API-only hotel catalog and booking service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt[crypto]>=2.10,<3",
    "python-json-logger>=3.3,<4",
    "python-multipart>=0.0.20,<1",
    "redis>=6.2,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
exclude = ["app/migrations"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["app"]
exclude = ["app/migrations"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [".", "app"]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
    "integration: requires a PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/migrations/*", "app/tests/*"]
